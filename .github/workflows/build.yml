name: 构建并推送镜像

# 触发条件：推代码到 main 分支，或在网页上手动点运行
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: registry.dev.oaiai.ai/student/heyang-hello

jobs:
  build:
    # 注意：GitHub 的 runner 本来就是 amd64，
    # 所以这里不需要像本地那样写 --platform linux/amd64。
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 这一步不能省。不装 buildx 的话，build-push-action 会退回 runner 上
      # 自带的 "default" builder（docker 驱动），而 runner 的 dockerd 用的是
      # 老的 overlay2 镜像存储，那个驱动只能生成 docker 格式的 manifest。
      # 教学仓库（Zot）只认 OCI 格式，于是会在最后推送 manifest 时报
      # "manifest invalid"（镜像层其实已经全部传完了）。
      # setup-buildx-action 会起一个 docker-container 驱动的 builder，
      # 由 buildkit 直接以 OCI 格式推送，问题就没了。
      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录教学镜像仓库
        uses: docker/login-action@v3
        with:
          registry: registry.dev.oaiai.ai
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # buildx 默认会附带一份 provenance 来源证明，并把它和镜像一起
          # 打包成 manifest list 推送。教学仓库（Zot）不认这个格式，会在
          # 推送最后一步报 "manifest invalid"（镜像层其实已经传完了）。
          # 关掉它即可，镜像内容完全不受影响。
          provenance: false
          sbom: false
          # 每次运行一个不重复的 tag，方便对照是哪一次构建出来的
          tags: |
            ${{ env.IMAGE }}:gh${{ github.run_number }}
            ${{ env.IMAGE }}:latest
